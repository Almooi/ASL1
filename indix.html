<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignStream – ASL Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700;900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f;--surface:#12121a;--accent:#7effb2;--accent2:#ff7eb3;
    --text:#e8e8f0;--muted:#4a4a60;--border:#1e1e2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
  body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
    background:radial-gradient(ellipse at 30% 20%,rgba(126,255,178,.05) 0%,transparent 50%),
               radial-gradient(ellipse at 70% 80%,rgba(255,126,179,.05) 0%,transparent 50%);
    pointer-events:none;z-index:0;}
  header{width:100%;padding:22px 32px 16px;display:flex;align-items:center;
    justify-content:space-between;border-bottom:1px solid var(--border);position:relative;z-index:1;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:1rem;color:var(--accent);}
  .logo span{color:var(--text);}
  .badge{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--border);padding:4px 10px;border-radius:2px;}

  .voice-banner{width:100%;max-width:840px;
    background:linear-gradient(135deg,rgba(126,255,178,.08),rgba(255,126,179,.06));
    border:1px solid rgba(126,255,178,.2);border-radius:12px;padding:14px 18px;
    display:flex;align-items:center;gap:14px;font-size:.7rem;line-height:1.5;color:var(--text);}
  .voice-banner .icon{font-size:1.4rem;flex-shrink:0;}
  .voice-banner strong{color:var(--accent);}
  .open-btn{margin-left:auto;flex-shrink:0;font-family:'Unbounded',sans-serif;font-size:.6rem;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;
    border-radius:6px;background:var(--accent);color:#0a0a0f;border:none;cursor:pointer;
    white-space:nowrap;text-decoration:none;display:inline-block;}
  .open-btn:hover{opacity:.85;}

  main{flex:1;width:100%;max-width:840px;padding:24px 20px;
    display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:1;}

  .hand-stage{width:100%;max-width:300px;aspect-ratio:1/1.05;background:var(--surface);
    border:1px solid var(--border);border-radius:22px;display:flex;align-items:center;
    justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 0 60px rgba(126,255,178,.05);}
  .hand-stage::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%,rgba(126,255,178,.07) 0%,transparent 70%);}
  .letter-label{position:absolute;top:12px;right:16px;font-family:'Unbounded',sans-serif;
    font-size:2.8rem;font-weight:900;color:var(--accent);opacity:.18;line-height:1;transition:opacity .3s;}
  .hand-stage.active .letter-label{opacity:.44;}
  #hand-svg{width:76%;height:76%;}
  @keyframes hand-in{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .hand-animate{animation:hand-in .16s ease-out both;}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:'Unbounded',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;
    transition:transform .15s,box-shadow .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);color:#0a0a0f;}
  .btn-primary:hover{box-shadow:0 0 26px rgba(126,255,178,.35);}
  .btn-primary.recording{background:var(--accent2);animation:pulse-btn 1.4s ease-in-out infinite;}
  @keyframes pulse-btn{0%,100%{box-shadow:0 0 0 0 rgba(255,126,179,.5)}50%{box-shadow:0 0 0 10px rgba(255,126,179,0)}}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-secondary:hover{color:var(--text);border-color:var(--muted);}
  .speed-control{display:flex;align-items:center;gap:8px;color:var(--muted);
    font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;width:78px;height:3px;background:var(--border);
    border-radius:2px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    background:var(--accent);border-radius:50%;cursor:pointer;}

  .text-input-wrap{width:100%;display:flex;gap:10px;}
  .text-input-wrap input{flex:1;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:.84rem;
    padding:12px 16px;outline:none;transition:border-color .2s;}
  .text-input-wrap input:focus{border-color:var(--accent);}
  .text-input-wrap input::placeholder{color:var(--muted);}

  .status{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s;}
  .dot.active{background:var(--accent2);animation:blink 1s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .transcript-area{width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:16px 20px;min-height:68px;
    display:flex;flex-wrap:wrap;gap:5px 3px;align-content:flex-start;
    max-height:120px;overflow-y:auto;}
  .word-chip{display:inline-flex;gap:1px;}
  .char-box{display:inline-block;font-family:'Unbounded',sans-serif;font-size:.68rem;font-weight:700;
    padding:3px 6px;border-radius:4px;background:var(--border);color:var(--muted);
    transition:background .18s,color .18s,transform .14s;}
  .char-box.active{background:var(--accent);color:#0a0a0f;transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(126,255,178,.3);}
  .char-box.done{background:rgba(126,255,178,.1);color:var(--accent);}
  .placeholder-text{font-size:.7rem;color:var(--muted);font-style:italic;
    width:100%;text-align:center;align-self:center;}
</style>
</head>
<body>

<header>
  <div class="logo">SIGN<span>STREAM</span></div>
  <div class="badge">ASL Fingerspelling</div>
</header>

<main>
  <div class="voice-banner">
    <span class="icon">🎙️</span>
    <div>
      <strong>Voice requires opening in your browser directly.</strong><br>
      The embedded preview blocks microphone access. Click "Open in Browser" → voice works fully there. Or just type below!
    </div>
    <button class="open-btn" onclick="openSelf()">Open in Browser</button>
  </div>

  <div class="hand-stage" id="handStage">
    <div class="letter-label" id="letterLabel">—</div>
    <svg id="hand-svg" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="micBtn" onclick="toggleMic()">🎙 Start Voice</button>
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
    <div class="speed-control">Speed <input type="range" id="speedSlider" min="1" max="10" value="5"></div>
  </div>

  <div class="text-input-wrap">
    <input type="text" id="textInput" placeholder="Type here → e.g. HELLO WORLD" oninput="typeInput(this.value)">
  </div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Ready — type above or click Open in Browser for voice</span>
  </div>

  <div class="transcript-area" id="transcriptArea">
    <div class="placeholder-text" id="placeholder">Signed letters appear here...</div>
  </div>
</main>

// ── Open as standalone blob URL so mic works ──────────────────────────────────
function openSelf(){
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  window.open(URL.createObjectURL(blob),'_blank');
}

     <rect x="64" y="26" width="18" height="84" rx="9" fill="${SK}"/>
     <ellipse cx="98" cy="90" rx="10" ry="8" fill="${SKD}"/>
     <ellipse cx="114" cy="88" rx="9" ry="7" fill="${SKD}"/>
     <ellipse cx="128" cy="94" rx="8" ry="7" fill="${SKD}"/>
     <ellipse cx="48" cy="118" rx="13" ry="20" fill="${SK}"/>
     <path d="M62 44 L118 44 L62 90 L118 90" stroke="rgba(126,255,178,.4)" stroke-width="2.5" stroke-dasharray="5 3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
};

function drawHand(L){
  const svg=document.getElementById('hand-svg');
  svg.innerHTML=SHAPES[L]||`<text x="100" y="130" text-anchor="middle" font-family="Unbounded,sans-serif" font-size="12" fill="rgba(255,255,255,.15)" font-weight="700">SPACE</text>`;
  svg.classList.remove('hand-animate');void svg.offsetWidth;svg.classList.add('hand-animate');
  document.getElementById('letterLabel').textContent=L;
  document.getElementById('handStage').classList.add('active');
}
function clearHand(){
  const SK2='#e8c9a0',SKD2='#c8a070';
  document.getElementById('hand-svg').innerHTML=
    `<rect x="55" y="100" width="90" height="100" rx="20" fill="${SK2}"/>
     <ellipse cx="45" cy="115" rx="16" ry="24" fill="${SK2}"/>
     <rect x="58" y="46" width="20" height="62" rx="10" fill="${SK2}"/>
     <rect x="82" y="40" width="20" height="68" rx="10" fill="${SK2}"/>
     <rect x="105" y="42" width="20" height="66" rx="10" fill="${SK2}"/>
     <rect x="126" y="50" width="18" height="58" rx="9" fill="${SK2}"/>
     <path d="M60 106 Q92 98 144 106" stroke="${SKD2}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  document.getElementById('letterLabel').textContent='—';
  document.getElementById('handStage').classList.remove('active');
}

// ── Speech Recognition ────────────────────────────────────────────────────────
let recognition=null,isListening=false;

function toggleMic(){
  const btn=document.getElementById('micBtn');
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){setStatus('Not supported — open in Chrome');return;}
  if(isListening){
    isListening=false;recognition?.stop();
    btn.textContent='🎙 Start Voice';btn.classList.remove('recording');
    document.getElementById('statusDot').classList.remove('active');
    setStatus('Stopped');return;
  }
  recognition=new SpeechRecognition();
  recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';
  let lastFinal='';
  recognition.onstart=()=>{setStatus('Listening...');document.getElementById('statusDot').classList.add('active');};
  recognition.onresult=(e)=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        const chunk=e.results[i][0].transcript.trim();
        const newChars=chunk.slice(lastFinal.length);lastFinal=chunk;
        if(newChars){appendTranscript(newChars+' ');queueLetters(newChars+' ');}
      }
    }
  };
  recognition.onerror=(e)=>{
    if(e.error==='not-allowed'){
      setStatus('Mic blocked — use the "Open in Browser" button above');
      isListening=false;btn.textContent='🎙 Start Voice';btn.classList.remove('recording');
      document.getElementById('statusDot').classList.remove('active');
    }else{setStatus('Error: '+e.error);}
  };
  recognition.onend=()=>{if(isListening)recognition.start();};
  try{recognition.start();isListening=true;btn.textContent='⏹ Stop Voice';btn.classList.add('recording');}
  catch(err){setStatus('Could not start: '+err.message);}
}

function setStatus(msg){document.getElementById('statusText').textContent=msg;}

// ── Animation queue ───────────────────────────────────────────────────────────
let charQueue=[],animRunning=false;
function getSpeed(){return Math.round(300-(document.getElementById('speedSlider').value-1)*(220/9));}
function queueLetters(text){[...text.toUpperCase()].forEach(ch=>charQueue.push(ch));if(!animRunning)runQueue();}
function runQueue(){
  if(!charQueue.length){animRunning=false;return;}
  animRunning=true;const ch=charQueue.shift();
  highlightNextBox(ch);
  if(ch===' '){setTimeout(runQueue,getSpeed()*.4);return;}
  drawHand(ch);setTimeout(runQueue,getSpeed());
}
function highlightNextBox(ch){
  const area=document.getElementById('transcriptArea');
  const prev=area.querySelector('.char-box.active');
  if(prev){prev.classList.remove('active');prev.classList.add('done');}
  for(const box of area.querySelectorAll('.char-box:not(.done):not(.active)')){
    if(box.dataset.char===ch){box.classList.add('active');box.scrollIntoView({block:'nearest',behavior:'smooth'});break;}
  }
}

// ── Transcript ────────────────────────────────────────────────────────────────
function appendTranscript(text){
  const area=document.getElementById('transcriptArea');
  document.getElementById('placeholder')?.remove();
  text.split(/(\s+)/).filter(Boolean).forEach(seg=>{
    if(/^\s+$/.test(seg)){const sp=document.createElement('span');sp.style.cssText='width:6px;display:inline-block';area.appendChild(sp);return;}
    const chip=document.createElement('div');chip.className='word-chip';
    [...seg.toUpperCase()].forEach(ch=>{
      const b=document.createElement('span');b.className='char-box';b.textContent=ch;b.dataset.char=ch;chip.appendChild(b);
    });
    area.appendChild(chip);
  });
  area.scrollTop=area.scrollHeight;
}

// ── Type input ────────────────────────────────────────────────────────────────
let lastTyped='';
function typeInput(val){
  const newChars=val.slice(lastTyped.length);if(!newChars)return;
  appendTranscript(newChars);queueLetters(newChars);lastTyped=val;
}

// ── Clear ─────────────────────────────────────────────────────────────────────
function clearAll(){
  charQueue=[];animRunning=false;lastTyped='';clearHand();
  document.getElementById('transcriptArea').innerHTML='<div class="placeholder-text" id="placeholder">Signed letters appear here...</div>';
  document.getElementById('textInput').value='';
  setStatus('Ready — type above or click Open in Browser for voice');
}

clearHand();
</script>
